name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Test gate (required before any artifact, spec §11). Runs the shared
  # NotabilityCore suite on Linux — same SQLite store the app ships with.
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift 6.3.3
        run: |
          cd /tmp
          curl -fsSL -o swift.tar.gz https://download.swift.org/swift-6.3.3-release/ubuntu2404/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-ubuntu24.04.tar.gz
          sudo mkdir -p /opt/swift
          sudo tar xzf swift.tar.gz -C /opt/swift --strip-components=1
          echo "/opt/swift/usr/bin" >> "$GITHUB_PATH"
          swift --version
      - name: Install toolchain libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libcurl4-openssl-dev libsqlite3-dev ninja-build pkg-config
      - name: Build snapshot-enabled libsqlite3
        run: bash .github/scripts/build-sqlite.sh
      - name: swift test
        run: swift test

  # Produce the unsigned .ipa for LiveContainer. macOS runner, but never touches
  # a paid Developer account: CODE_SIGNING_ALLOWED=NO, ad-hoc/unsigned output.
  build-ios:
    needs: test-core
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: App
        run: xcodegen generate
      - name: Build unsigned app (device)
        working-directory: App
        run: |
          xcodebuild -project NotabilityClone.xcodeproj -target NotabilityClone \
            -configuration Release -sdk iphoneos SYMROOT="$PWD/build" OBJROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Unit test on simulator
        working-directory: App
        run: |
          xcodebuild -project NotabilityClone.xcodeproj -scheme NotabilityClone \
            -configuration Debug -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath buildtest CODE_SIGNING_ALLOWED=NO test
      - name: Package unsigned IPA (LiveContainer)
        working-directory: App
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NotabilityClone.app Payload/
          zip -qr NotabilityClone.ipa Payload
          ls -lh NotabilityClone.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: NotabilityClone-unsigned-ipa
          path: App/NotabilityClone.ipa
          if-no-files-found: error

  # After any push to main: publish a beta release with the IPA attached.
  release:
    needs: build-ios
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NotabilityClone-unsigned-ipa
          path: artifact
      - name: Tag beta release
        id: tag
        run: |
          echo "tag=$(date +'beta-%Y.%m.%d-%H%M')" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" artifact/NotabilityClone.ipa \
            --repo "${{ github.repository }}" \
            --title "Beta ${{ steps.tag.outputs.tag }}" \
            --notes "Unsigned build for LiveContainer (install via LiveContainer, no Apple Developer account required)." \
            --prerelease